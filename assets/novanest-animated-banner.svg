<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">NovaNest AI Automation Animated Banner</title>
  <desc id="desc">Animated neon blue and violet banner for the NovaNest Retell AI post-call analysis project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d22"/>
      <stop offset=".55" stop-color="#11143b"/>
      <stop offset="1" stop-color="#25104b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d9ff"/>
      <stop offset=".5" stop-color="#7c83ff"/>
      <stop offset="1" stop-color="#d46cff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5a4bff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5a4bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#91a9ff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="240" cy="65" rx="260" ry="170" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="180;390;180" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1000" cy="310" rx="260" ry="170" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="1020;830;1020" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".8">
    <path d="M0 270 C170 220 220 320 370 270 S620 220 760 270 S1010 320 1200 240" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-96" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 286 C170 236 220 336 370 286 S620 236 760 286 S1010 336 1200 256" opacity=".35" stroke-dasharray="4 18">
      <animate attributeName="stroke-dashoffset" values="0;110" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  <g>
    <rect x="58" y="48" width="7" height="7" rx="2" fill="#43e7ff"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="1110" y="72" width="8" height="8" rx="2" fill="#c78aff"><animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/></rect>
    <circle cx="1080" cy="260" r="4" fill="#43e7ff"><animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="290" r="3" fill="#c78aff"><animate attributeName="r" values="2;5;2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(78 95)">
    <rect width="76" height="76" rx="20" fill="#111b40" stroke="url(#line)" stroke-width="2"/>
    <path d="M20 43 L34 28 L47 43 L59 27 M34 28 V54 M20 43 V55 H59 V43" fill="none" stroke="#d7f8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="43" r="4" fill="#3fe2ff"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="59" cy="27" r="4" fill="#d78aff"><animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="180" y="123" fill="#a7caff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">RETELL AI • TOPIC 09</text>
  <text x="178" y="180" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="800">NovaNest</text>
  <text x="180" y="218" fill="#d9e2ff" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="500">Post-Call Analysis • Lead Scoring • QA Dashboards</text>
  <g transform="translate(180 250)" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">
    <rect width="105" height="34" rx="17" fill="#163354" stroke="#3bdcff" stroke-opacity=".75"/>
    <text x="52.5" y="22" fill="#9cefff" text-anchor="middle">RETELL AI</text>
    <rect x="117" width="68" height="34" rx="17" fill="#292653" stroke="#9387ff" stroke-opacity=".8"/>
    <text x="151" y="22" fill="#d2caff" text-anchor="middle">n8n</text>
    <rect x="197" width="142" height="34" rx="17" fill="#173c35" stroke="#55e6a6" stroke-opacity=".8"/>
    <text x="268" y="22" fill="#aaf7d6" text-anchor="middle">GOOGLE SHEETS</text>
  </g>
  <g transform="translate(935 100)" fill="none" stroke="url(#line)" stroke-width="2">
    <circle cx="65" cy="65" r="57" stroke-dasharray="6 9"><animateTransform attributeName="transform" type="rotate" from="0 65 65" to="360 65 65" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="65" cy="65" r="40" stroke-opacity=".5"/>
    <path d="M65 38 V65 L86 79" stroke="#e9faff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="65" r="5" fill="#64e7ff" stroke="none"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <path d="M65 8 V0 M122 65 H132 M65 122 V132 M8 65 H0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1000" y="250" text-anchor="middle" fill="#bdc8ff" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">CALL → ANALYZE → LOG</text>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#line)" stroke-opacity=".75" stroke-width="2"/>
  <path d="M28 14 H180" stroke="#43e7ff" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>